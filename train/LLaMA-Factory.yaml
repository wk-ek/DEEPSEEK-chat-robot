### LLaMA-Factory 训练配置：阿米娅人格模型
###
### 用法（在云端容器里）
###   git clone https://github.com/hiyouga/LLaMA-Factory.git
###   cd LLaMA-Factory && pip install -e ".[torch,metrics]"
###   llamafactory-cli train /path/to/this/LLaMA-Factory.yaml
###
### 设计取舍：
###   · 用 Qwen3-4B-Instruct 而不是 7B —— 4B 在 4GB 本地显存也能跑 Q4，训练完能落回你自己的机器
###   · QLoRA 4bit 训练 —— 4090 24G 够用，而且便宜
###   · r=16 而不是 64 —— 人格风格是「浅层调整」，16 够了；r 越大越容易过拟合到具体句子
###   · 3 个 epoch —— 3400 条样本，3 轮约 1 万步以内，20-30 分钟能跑完

### ---- 模型 ----
model_name_or_path: Qwen/Qwen3-4B-Instruct-2507
# 备选（中文更强但慢一些）：Qwen/Qwen3-8B-Instruct
# 备选（更小更快，质量下降）：Qwen/Qwen3-1.7B-Instruct
stage: sft
do_train: true
finetuning_type: lora
lora_target: all

### ---- 量化：QLoRA ----
quantization_bit: 4
quantization_method: bitsandbytes

### ---- LoRA 超参 ----
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05

### ---- 数据 ----
dataset_dir: /workspace/data
dataset: amiya_train
eval_dataset: amiya_val
template: qwen3
cutoff_len: 1024              # 样本都很短（回答均长 20 字），1024 足够
preprocessing_num_workers: 8
max_samples: 100000
overwrite_cache: true

### ---- 训练超参 ----
per_device_train_batch_size: 4
gradient_accumulation_steps: 4      # 等效 batch = 16
learning_rate: 1.0e-4               # QLoRA 常用量级；想更稳可以降到 5e-5
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
weight_decay: 0.01
max_grad_norm: 1.0
bf16: true
gradient_checkpointing: true        # 省显存，代价是慢 20%

### ---- 日志与保存 ----
logging_steps: 10
save_steps: 200
save_total_limit: 3
plot_loss: true
output_dir: /workspace/output/amiya-lora

### ---- 评测 ----
per_device_eval_batch_size: 4
eval_strategy: steps
eval_steps: 200

### ---- 其他 ----
report_to: none
seed: 42
