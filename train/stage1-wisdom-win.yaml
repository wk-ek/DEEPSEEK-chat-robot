### 【Windows 版】不使用 QLoRA 4bit —— bitsandbytes 在 Windows 上经常装不上。
### 改用 fp16 LoRA：多占约 6 GB 显存，4090 24G 完全够。
### 如果 bitsandbytes 装成功了，run.ps1 会自动改用不带 -win 的原版 yaml。
### Stage 1 —— 智慧层：让她「认识这个世界」
###
### 目标：不是学怎么说话，是学「泰拉是什么样的地方」。
###   乌萨斯在哪、源石是什么、感染者怎么被对待、整合运动为什么起来……
###   一个不知道自己活在什么世界里的角色，回答什么都是空的。
###
### 数据：
###   wisdom_operators.jsonl   1266 条（422 个干员档案，正则提取，免费）
###   wisdom_lore.jsonl        约 870 条（109 个剧情章节的世界观提炼）
###
### 训练时长：约 20-30 分钟（4090 24G）
### 花费：约 1-2 元算力

model_name_or_path: Qwen/Qwen3-4B-Instruct-2507
stage: sft
do_train: true
finetuning_type: lora
lora_target: all

### 量化
# quantization_bit: 4           # Windows 上 bitsandbytes 可能不可用，改用 fp16 LoRA
# quantization_method: bitsandbytes
### LoRA：智慧层用稍大的 rank，因为它要装的是「知识」不是「语气」
lora_rank: 32
lora_alpha: 64
lora_dropout: 0.05

### 数据
dataset_dir: /workspace/data
dataset: amiya_wisdom
eval_dataset: amiya_wisdom_val
template: qwen3
cutoff_len: 1536              # 世界观答案比对话长
preprocessing_num_workers: 8
max_samples: 100000
overwrite_cache: true

### 训练超参
per_device_train_batch_size: 4
gradient_accumulation_steps: 4
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
weight_decay: 0.01
max_grad_norm: 1.0
bf16: true
gradient_checkpointing: true

### 日志
logging_steps: 10
save_steps: 200
save_total_limit: 2
plot_loss: true
output_dir: /workspace/output/stage1-wisdom

per_device_eval_batch_size: 4
eval_strategy: steps
eval_steps: 200

report_to: none
seed: 42
